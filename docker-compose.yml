version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mediflow-postgres
    environment:
      POSTGRES_DB: mediflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mediflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mediflow-backend
    environment:
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/mediflow
      DB_USERNAME: postgres
      DB_PASSWORD: postgrespassword
      FRONTEND_URL: http://localhost:5173,http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mediflow-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
