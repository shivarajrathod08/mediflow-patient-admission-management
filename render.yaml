services:
  # Backend Spring Boot Web Service
  - type: web
    name: mediflow-backend
    env: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: mediflow-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: mediflow-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: mediflow-db
          property: password
      - key: FRONTEND_URL
        value: https://mediflow-frontend.vercel.app

databases:
  # Managed PostgreSQL
  - name: mediflow-db
    databaseName: mediflow
    user: mediflow_user
    plan: free
